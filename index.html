<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Bachar"><meta name="theme-color" content="#0A0A0C"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><title>Bachar Performance</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0C;--c:#181A20;--o:#22252D;--b:#2E323D;--g:#00FF87;--t:#fff;--t2:#9BA1B0;--w:#FFB800;--d:#FF3B30;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font:14px Inter,system-ui,sans-serif}
h1,h2,h3,.sg,button,label,th{font-family:'Space Grotesk',system-ui,sans-serif}
nav{position:fixed;z-index:5;background:#121316;border-color:var(--b)}
nav .logo{font-weight:700;letter-spacing:-.02em;line-height:1.1;padding:8px 12px 18px}nav .logo small{display:block;color:var(--g);font-size:10px;letter-spacing:.08em}
nav button{background:none;border:0;color:var(--t2);text-align:left;padding:12px;font-size:13px;cursor:pointer;border-radius:4px;white-space:nowrap}
nav button.on{color:var(--t);box-shadow:inset 2px 0 var(--g);background:var(--o)}
@media(min-width:800px){nav{left:0;top:0;bottom:0;width:200px;border-right:1px solid var(--b);padding:20px 10px;display:flex;flex-direction:column}main{margin-left:200px}}
@media(max-width:799px){nav{left:0;right:0;bottom:0;border-top:1px solid var(--b);display:flex;overflow-x:auto;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}nav .logo{display:none}nav button{flex:1;min-width:78px;text-align:center;min-height:48px}nav button.on{box-shadow:inset 0 2px var(--g)}main{padding-bottom:80px}}
main{padding:20px;max-width:1380px}
h2{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}.mot{color:var(--g);font-size:11px;letter-spacing:.08em;font-weight:600;margin-bottom:20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:16px;margin-bottom:16px;animation:in .3s}.grid .card{margin:0}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.lab{font:600 11px 'Space Grotesk';letter-spacing:.08em;text-transform:uppercase;color:var(--t2);margin-bottom:8px}
.big{font:700 40px/1 'Space Grotesk';letter-spacing:-.03em}.big small{font-size:14px;color:var(--g);margin-left:4px}
.btn{background:var(--g);color:var(--bg);border:0;border-radius:4px;min-height:44px;padding:0 16px;font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.06em;cursor:pointer}
.btn:hover{box-shadow:0 0 16px rgba(0,255,135,.3)}.gh{background:none;color:var(--t);border:1px solid var(--b)}.gh:hover{border-color:var(--g);color:var(--g);box-shadow:none}.dg{background:rgba(255,59,48,.1);color:var(--d);border:1px solid rgba(255,59,48,.3)}.sm{min-height:34px;padding:0 10px}
input,select,textarea{background:#121316;border:1px solid var(--b);color:var(--t);border-radius:4px;min-height:44px;padding:0 10px;font:inherit;width:100%}textarea{padding:10px;min-height:70px}input:focus,select:focus,textarea:focus{outline:1px solid var(--g)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.tag{display:inline-block;height:22px;line-height:20px;padding:0 8px;border-radius:4px;font-size:11px;background:rgba(0,255,135,.1);color:var(--g);border:1px solid rgba(0,255,135,.2)}.tag.r{background:var(--o);color:var(--t2);border-color:var(--b)}.tag.m{background:rgba(255,184,0,.1);color:var(--w);border-color:rgba(255,184,0,.2)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:var(--o);border:1px solid var(--b);border-radius:6px;padding:8px 4px;text-align:center;font-size:11px}.day.t{border-color:var(--g)}
.empty{color:var(--t2);padding:20px;text-align:center;border:1px dashed var(--b);border-radius:8px}
table{width:100%;border-collapse:collapse}th{font-size:10px;letter-spacing:.08em;color:var(--t2);text-align:left;padding:4px}td{padding:3px}td input{padding:0 6px;min-height:44px}
.ck{width:44px;height:44px;border:1px solid var(--b);background:#121316;border-radius:4px;color:var(--bg);font-size:18px;cursor:pointer}.ck.on{background:var(--g)}
.bar{height:6px;background:#121316;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);box-shadow:0 0 8px var(--g)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}.md{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:20px;width:100%;max-width:460px;max-height:100%;overflow:auto}.md label{display:block;margin:10px 0 4px;font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.08em}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;display:block}
.av{width:72px;height:72px;border-radius:50%;background:var(--o);border:1px solid var(--g);object-fit:cover;display:flex;align-items:center;justify-content:center;font:700 22px 'Space Grotesk'}
svg{width:100%;height:auto;display:block}
html{-webkit-text-size-adjust:100%;min-height:100dvh;overscroll-behavior:none}*{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-size:16px;-webkit-appearance:none;appearance:none}select{background-image:linear-gradient(45deg,transparent 50%,#9BA1B0 50%),linear-gradient(135deg,#9BA1B0 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
table{table-layout:fixed}th:first-child,td:first-child{width:22px}th:last-child,td:last-child{width:90px;white-space:nowrap}td input{padding:0 2px;text-align:center;min-width:0}
@media(max-width:799px){main{padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}.ck{width:40px}.ov{align-items:flex-start;padding-top:calc(24px + env(safe-area-inset-top,0px))}h2{font-size:24px}}
</style></head><body>
